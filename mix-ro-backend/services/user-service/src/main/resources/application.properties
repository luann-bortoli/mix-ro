spring.application.name=user-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/user_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000

logging.level.org.springframework.security=DEBUG

