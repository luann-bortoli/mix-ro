services:
  user-service-db:
    image: mysql:8.4
    container_name: user-service-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: user_service
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - user-service-db-data:/var/lib/mysql

volumes:
  user-service-db-data: